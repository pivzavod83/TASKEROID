<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskeroid — Organise Your Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bone: #F5F0E8;
    --gold-bright: #F0C060;
    --deep-space: #020408;
  }

  html, body {
    width: 100%; height: 100%;
    overflow-x: hidden;
    background: var(--deep-space);
    font-family: 'Archivo Black', sans-serif;
    color: var(--bone);
  }

  #starCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== PLANETS ===== */
  .planet-wrap {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    animation: planetFadeIn 2s ease forwards;
  }
  @keyframes planetFadeIn { to { opacity: 1; } }

  .planet-wrap canvas {
    display: block;
    mix-blend-mode: screen;
  }

  @keyframes rotatePlanet        { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
  @keyframes rotatePlanetReverse { from { transform: rotate(0deg); }   to { transform: rotate(-360deg); } }

  .planet-spin        { animation: rotatePlanet        30s linear infinite; }
  .planet-spin-slow   { animation: rotatePlanet        50s linear infinite; }
  .planet-spin-rev    { animation: rotatePlanetReverse 40s linear infinite; }
  .planet-spin-vslow  { animation: rotatePlanet        70s linear infinite; }
  .planet-spin-med    { animation: rotatePlanet        38s linear infinite; }

  /* Positions */
  .pos-mars    { bottom: -60px; left: -60px;  animation-delay: 1.5s; }
  .pos-jupiter { top: -100px;   right: -80px; animation-delay: 1.8s; }
  .pos-saturn  { top: 50%;      right: 2%;    animation-delay: 2.1s; }
  .pos-blue    { top: 28%;      left: 2%;     animation-delay: 2.4s; }
  .pos-pluto   { bottom: 18%;   right: 10%;   animation-delay: 2.7s; }
  .pos-moon    { top: 12%;      left: 20%;    animation-delay: 3.0s; }
  .pos-teal    { bottom: 5%;    right: 30%;   animation-delay: 3.3s; }

  /* ===== MAIN CONTENT ===== */
  #mainContent {
    position: relative;
    z-index: 10;
    min-height: 100vh;
  }

  .hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
  }

  .hero-block {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    width: max-content;
    max-width: 90vw;
  }

  .animate-in {
    opacity: 0;
    transform: translateY(40px);
    animation: riseIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes riseIn { to { opacity: 1; transform: translateY(0); } }

  h1.title {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(72px, 12vw, 160px);
    font-weight: 900;
    letter-spacing: 0.05em;
    color: #ffffff;
    line-height: 1;
    text-shadow: none;
    text-align: center;
  }

  .subtitle-wrap {
    position: relative;
    margin-top: 20px;
    animation-delay: 0.55s;
    align-self: flex-start;
    padding-left: 4px;
  }

  .subtitle {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(18px, 2.5vw, 40px);
    font-weight: 900;
    letter-spacing: 0.03em;
    color: rgba(245, 240, 232, 0.85);
    white-space: nowrap;
    display: inline;
  }

  .subtitle .highlight { color: var(--gold-bright); }

  .star-accent {
    position: absolute;
    font-size: 18px;
    color: var(--gold-bright);
    animation: twinkleAccent 2s ease-in-out infinite;
    filter: drop-shadow(0 0 5px var(--gold-bright));
    pointer-events: none;
  }
  @keyframes twinkleAccent {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.3; transform: scale(0.6); }
  }

  /* Buttons — moved down extra 50px via margin-top */
  .buttons-wrap {
    display: flex;
    gap: 24px;
    margin-top: 130px;
    animation-delay: 0.8s;
    justify-content: center;
    align-self: center;
    flex-wrap: wrap;
  }

  .dl-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bone);
    border: none;
    border-radius: 14px;
    padding: 18px 32px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }

  .dl-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 60%);
    pointer-events: none;
  }

  .dl-btn:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 14px 50px rgba(212, 168, 83, 0.4);
    background: #FAF5EC;
  }

  .btn-icon {
    width: 34px; height: 34px;
    object-fit: contain;
  }

  /* Apple icon has black bg — invert to make it dark on bone button */
  .btn-icon-apple {
    filter: invert(1) brightness(0.15);
  }

  .btn-text {
    display: flex;
    flex-direction: column;
    text-align: left;
  }

  .btn-label {
    font-family: 'Archivo Black', sans-serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #8a7355;
    line-height: 1;
    margin-bottom: 4px;
  }

  .btn-name {
    font-family: 'Archivo Black', sans-serif;
    font-size: 20px;
    letter-spacing: 0.01em;
    color: #1a1510;
    line-height: 1;
  }
</style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<!-- Planet wrappers -->
<div class="planet-wrap pos-mars"    id="pw-mars"></div>
<div class="planet-wrap pos-jupiter" id="pw-jupiter"></div>
<div class="planet-wrap pos-saturn"  id="pw-saturn"></div>
<div class="planet-wrap pos-blue"    id="pw-blue"></div>
<div class="planet-wrap pos-pluto"   id="pw-pluto"></div>
<div class="planet-wrap pos-moon"    id="pw-moon"></div>
<div class="planet-wrap pos-teal"    id="pw-teal"></div>

<div id="mainContent">
  <div class="hero">
    <div class="hero-block">

      <div class="animate-in" style="animation-delay:0.3s; text-align:center;">
        <h1 class="title">Taskeroid</h1>
      </div>

      <div class="subtitle-wrap animate-in" style="animation-delay:0.55s">
        <p class="subtitle" id="subtitleText">
          <span class="highlight">Organise</span> your tasks to reach the stars
        </p>
      </div>

      <div class="buttons-wrap animate-in" style="animation-delay:0.8s">
        <a href="downloads/taskeroid.dmg" download class="dl-btn">
          <img class="btn-icon btn-icon-apple" src="icons/apple.png" alt="macOS">
          <div class="btn-text">
            <span class="btn-label">Download on</span>
            <span class="btn-name">MacOS</span>
          </div>
        </a>
        <a href="downloads/taskeroid.exe" download class="dl-btn">
          <img class="btn-icon" src="icons/windows.png" alt="Windows">
          <div class="btn-text">
            <span class="btn-label">Download on</span>
            <span class="btn-name">Windows</span>
          </div>
        </a>
      </div>

    </div>
  </div>
</div>

<script>
// ===== PLANET RENDERING =====
const planetDefs = [
  { id:'pw-mars',    src:'planets/Mars.png',    size:260, spin:'planet-spin',      glow:'rgba(200,80,20,0.4)',    circle:true  },
  { id:'pw-jupiter', src:'planets/Jupiter.png',  size:240, spin:'planet-spin-vslow',glow:'rgba(180,150,80,0.25)', circle:false },
  { id:'pw-saturn',  src:'planets/Saturn.png',  size:200, spin:'planet-spin-slow', glow:'rgba(200,170,80,0.35)', circle:false },
  { id:'pw-blue',    src:'planets/Planet3.png', size:160, spin:'planet-spin-rev',  glow:'rgba(30,100,200,0.4)',   circle:true  },
  { id:'pw-pluto',   src:'planets/Planet1.png', size:120, spin:'planet-spin',      glow:'rgba(150,130,200,0.3)', circle:true  },
  { id:'pw-moon',    src:'planets/Moon.png',    size:100, spin:'planet-spin-slow', glow:'rgba(180,180,180,0.25)',circle:true  },
  { id:'pw-teal',    src:'planets/Planet2.png', size:150, spin:'planet-spin-med',  glow:'rgba(0,180,180,0.35)',  circle:true  },
];

console.log('[Planets] Page origin:', window.location.origin, '| href:', window.location.href);

planetDefs.forEach(def => {
  const wrap = document.getElementById(def.id);

  if (!wrap) {
    console.error(`[Planets] ❌ Wrapper element NOT FOUND in DOM: #${def.id}`);
    return;
  }
  console.log(`[Planets] ✅ Wrapper found: #${def.id}`);

  const img = new Image();

  img.onload = () => {
    console.log(`[Planets] ✅ Image loaded: ${def.src} (${img.naturalWidth}×${img.naturalHeight})`);

    const aspect = img.naturalHeight / img.naturalWidth;
    const w = def.size;
    const h = def.circle ? def.size : Math.round(w * aspect);

    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cx = c.getContext('2d');

    if (!cx) {
      console.error(`[Planets] ❌ Could not get 2D context for: ${def.src}`);
      return;
    }

    if (def.circle) {
      cx.save();
      cx.beginPath();
      cx.arc(w/2, h/2, w/2, 0, Math.PI*2);
      cx.clip();
      cx.drawImage(img, 0, 0, w, h);
      cx.restore();
    } else {
      cx.drawImage(img, 0, 0, w, h);
    }

    // Check if canvas is blank (possible CORS taint)
    try {
      const pixel = cx.getImageData(w/2, h/2, 1, 1).data;
      console.log(`[Planets] 🎨 Centre pixel RGBA for ${def.src}: [${pixel[0]}, ${pixel[1]}, ${pixel[2]}, ${pixel[3]}]`);
      if (pixel[3] === 0) console.warn(`[Planets] ⚠️ Centre pixel is transparent — image may not have drawn correctly`);
    } catch(e) {
      console.error(`[Planets] ❌ getImageData failed (CORS/taint?) for ${def.src}:`, e.message);
    }

    c.style.filter = `drop-shadow(0 0 20px ${def.glow})`;
    c.classList.add(def.spin);
    wrap.appendChild(c);
    wrap.style.width = w + 'px';
    wrap.style.height = h + 'px';
    console.log(`[Planets] 🪐 Canvas appended to #${def.id} (${w}×${h})`);
  };

  img.onerror = (e) => {
    console.error(`[Planets] ❌ FAILED to load image: "${def.src}"`);
    console.error(`[Planets]    Resolved URL attempted: ${new URL(def.src, window.location.href).href}`);
    console.error(`[Planets]    Check: does the file exist? Is the server running? Is there a typo?`);
  };

  const resolvedURL = new URL(def.src, window.location.href).href;
  console.log(`[Planets] 🔄 Loading: ${def.src}  →  ${resolvedURL}`);
  img.src = def.src;
});

// ===== STAR ACCENT =====
window.addEventListener('load', () => {
  const subtitle = document.getElementById('subtitleText');
  const walker = document.createTreeWalker(subtitle, NodeFilter.SHOW_TEXT);
  let node;
  while (node = walker.nextNode()) {
    const idx = node.textContent.indexOf('stars');
    if (idx !== -1) {
      const range = document.createRange();
      range.setStart(node, idx);
      range.setEnd(node, idx + 5);
      const rect = range.getBoundingClientRect();
      const wrapRect = subtitle.parentElement.getBoundingClientRect();
      const star = document.createElement('span');
      star.className = 'star-accent';
      star.textContent = '✦';
      star.style.left = (rect.right - wrapRect.left + 5) + 'px';
      star.style.top = '-16px';
      subtitle.parentElement.appendChild(star);
      break;
    }
  }
});

// ===== STARFIELD =====
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let stars = [], shootingStars = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  createStars();
}

function createStars() {
  stars = [];
  for (let i = 0; i < 2200; i++) {
    const s = Math.random();
    stars.push({
      x: Math.random()*canvas.width, y: Math.random()*canvas.height,
      r: s<0.7 ? Math.random()*0.8+0.2 : s<0.92 ? Math.random()*1.2+0.6 : Math.random()*2+1,
      alpha: Math.random()*0.5+0.5,
      ts: Math.random()*0.02+0.005,
      to: Math.random()*Math.PI*2,
      hue: Math.random()<0.15 ? (Math.random()<0.5?220:40) : 210,
    });
  }
}

function createShootingStar() {
  const angle = (Math.random()*30+10)*Math.PI/180;
  shootingStars.push({
    x: Math.random()*canvas.width*0.7,
    y: Math.random()*canvas.height*0.5,
    vx: Math.cos(angle)*(Math.random()*8+6),
    vy: Math.sin(angle)*(Math.random()*8+6),
    alpha:1, trail:[], maxTrail:28, life:0, maxLife:55,
  });
}

let lastShoot=0, nextDelay=2000+Math.random()*3000;

function drawStars(t) {
  for (const s of stars) {
    const tw = Math.sin(t*s.ts+s.to);
    const a = s.alpha*(0.6+0.4*tw);
    const r = s.r*(0.85+0.15*tw);
    ctx.save();
    if (s.r>1.5) {
      const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*4);
      g.addColorStop(0,`hsla(${s.hue},70%,95%,${a})`);
      g.addColorStop(0.3,`hsla(${s.hue},60%,85%,${a*0.5})`);
      g.addColorStop(1,`hsla(${s.hue},50%,80%,0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,s.y,r*4,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=a;
    ctx.fillStyle=`hsl(${s.hue},70%,97%)`;
    ctx.beginPath(); ctx.arc(s.x,s.y,r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawShootingStars() {
  for (let i=shootingStars.length-1;i>=0;i--) {
    const ss=shootingStars[i];
    ss.trail.push({x:ss.x,y:ss.y});
    if(ss.trail.length>ss.maxTrail) ss.trail.shift();
    ss.x+=ss.vx; ss.y+=ss.vy; ss.life++;
    const p=ss.life/ss.maxLife;
    ss.alpha=p<0.3?p/0.3:1-(p-0.3)/0.7;
    if(ss.trail.length>1) {
      for(let j=1;j<ss.trail.length;j++) {
        const f=j/ss.trail.length;
        ctx.save();
        ctx.globalAlpha=f*ss.alpha*0.9;
        ctx.strokeStyle='rgba(220,230,255,1)';
        ctx.lineWidth=f*2.5;
        ctx.shadowBlur=8; ctx.shadowColor='rgba(180,200,255,0.8)';
        ctx.beginPath();
        ctx.moveTo(ss.trail[j-1].x,ss.trail[j-1].y);
        ctx.lineTo(ss.trail[j].x,ss.trail[j].y);
        ctx.stroke(); ctx.restore();
      }
    }
    ctx.save(); ctx.globalAlpha=ss.alpha;
    const g=ctx.createRadialGradient(ss.x,ss.y,0,ss.x,ss.y,6);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(0.3,'rgba(200,215,255,0.8)');
    g.addColorStop(1,'rgba(150,170,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ss.x,ss.y,6,0,Math.PI*2); ctx.fill(); ctx.restore();
    if(ss.life>=ss.maxLife) shootingStars.splice(i,1);
  }
}

function animate(t) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawStars(t*0.001);
  drawShootingStars();
  if(t-lastShoot>nextDelay) {
    createShootingStar();
    lastShoot=t;
    nextDelay=9000+Math.random()*2000;
  }
  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
