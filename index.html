<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>Taskeroid</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    * { margin: 0; padding: 0; }
    body { padding: 0; min-height: 100vh; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #scene-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    #scene-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #task-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 420px;
      max-width: 100%;
      height: 100%;
      background: rgba(15, 20, 25, 0.97);
      z-index: 20;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 24px rgba(0,0,0,0.4);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      overflow: auto;
    }
    #task-panel.open {
      transform: translateX(0);
    }
    #task-panel .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    #task-panel .panel-header h2 {
      font-size: 1.25rem;
      color: #58a6ff;
    }
    #task-panel .panel-close {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 24px;
      cursor: pointer;
      padding: 0 8px;
      line-height: 1;
    }
    #task-panel .panel-close:hover {
      color: #e6edf3;
    }
    #task-panel .panel-content {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
    }
    #task-panel .app {
      max-width: 100%;
      margin: 0;
    }
    #task-panel header {
      margin-bottom: 16px;
    }
    #task-panel header h1 {
      font-size: 1.25rem;
    }
    #task-panel header p {
      font-size: 0.8rem;
    }
    #asteroid-edit-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      min-width: 280px;
      display: none;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #asteroid-edit-popup.open { display: block; }
    #asteroid-edit-popup h3 { color: #58a6ff; margin-bottom: 16px; font-size: 1rem; }
    #asteroid-edit-popup input { width: 100%; padding: 8px 10px; margin-bottom: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 14px; }
    #asteroid-edit-popup label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 4px; }
    #asteroid-edit-popup .form-group { margin-bottom: 12px; }
    #asteroid-edit-popup .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    #asteroid-edit-popup button { padding: 8px 14px; font-size: 13px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; cursor: pointer; }
    #asteroid-edit-popup button:hover { background: #30363d; }
    #asteroid-edit-popup button.primary { background: #238636; border-color: #238636; color: white; }
    #asteroid-edit-popup button.primary:hover { background: #2ea043; }
    #asteroid-edit-popup button.delete { color: #f85149; border-color: #f85149; }
    #asteroid-edit-popup button.delete:hover { background: rgba(248,81,73,0.2); }
    #asteroid-edit-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 25; display: none;
    }
    #asteroid-edit-backdrop.open { display: block; }
  </style>
</head>
<body>
  <div id="scene-container">
    <canvas id="wallpaper-canvas"></canvas>
  </div>
  <div id="asteroid-edit-backdrop"></div>
  <div id="asteroid-edit-popup"></div>
  <div id="task-panel">
    <div class="panel-header">
      <h2>Tasks</h2>
      <button id="panel-close" class="panel-close" type="button">×</button>
    </div>
    <div class="panel-content">
      <div id="root"></div>
    </div>
  </div>
  <script src="dist/wallpaper-renderer.js"></script>
  <script src="dist/ui.js"></script>
  <script>
    (function() {
      const panel = document.getElementById('task-panel');
      const closeBtn = document.getElementById('panel-close');
      if (closeBtn && panel) closeBtn.addEventListener('click', () => panel.classList.remove('open'));
      window.openTaskPanel = function() { panel?.classList.add('open'); };
    })();
  </script>
</body>
</html>
