<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Taskeroid</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    :root {
      --titlebar-h: 34px;
    }
    body {
      padding: 0; margin: 0;
      min-height: 100vh;
      font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #app-titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--titlebar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 12px;
      background: rgba(1, 7, 14, 0.92);
      border-bottom: 1px solid rgba(0, 229, 212, 0.25);
      z-index: 60;
      -webkit-app-region: drag;
      user-select: none;
    }
    #app-titlebar .title {
      color: #00e5d4;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 229, 212, 0.35);
    }
    #app-titlebar .controls {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    #app-titlebar .tb-btn {
      width: 32px;
      height: 24px;
      border: 1px solid rgba(0, 229, 212, 0.32);
      background: rgba(0, 20, 32, 0.9);
      color: #b8d8e4;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace;
    }
    #app-titlebar .tb-btn:hover {
      background: rgba(0, 229, 212, 0.18);
      color: #00e5d4;
      border-color: rgba(0, 229, 212, 0.6);
    }
    #app-titlebar .tb-btn.close:hover {
      background: rgba(255, 50, 71, 0.18);
      color: #ff3247;
      border-color: rgba(255, 50, 71, 0.7);
    }
    #scene-container {
      position: fixed;
      top: var(--titlebar-h);
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
    }
    #scene-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #task-panel {
      position: fixed; top: var(--titlebar-h); right: 0;
      width: 420px; max-width: 100%; height: calc(100% - var(--titlebar-h));
      background: rgba(2, 8, 16, 0.97);
      z-index: 20; display: flex; flex-direction: column;
      box-shadow: -1px 0 0 0 rgba(0,229,212,0.25), -4px 0 0 0 rgba(0,229,212,0.05);
      transform: translateX(100%);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: auto;
      border-left: 2px solid rgba(0, 229, 212, 0.35);
    }
    #task-panel.open {
      transform: translateX(0);
    }
    #task-panel .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(0, 229, 212, 0.2);
      flex-shrink: 0;
      background: rgba(0, 12, 22, 0.98);
    }
    #task-panel .panel-header h2 {
      font-size: 0.86rem;
      color: #00e5d4;
      text-shadow: 0 0 12px rgba(0, 229, 212, 0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #task-panel .panel-close {
      background: transparent;
      border: 1px solid rgba(0, 229, 212, 0.3);
      color: rgba(0, 229, 212, 0.7);
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace;
    }
    #task-panel .panel-close:hover {
      background: rgba(0, 229, 212, 0.12);
      border-color: rgba(0, 229, 212, 0.6);
      color: #00e5d4;
    }
    #task-panel .panel-content {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
    }
    #task-panel .app {
      max-width: 100%;
      margin: 0;
    }
    #task-panel header {
      margin-bottom: 16px;
    }
    #task-panel header h1 {
      font-size: 0.95rem;
    }
    #task-panel header p {
      font-size: 0.72rem;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    #asteroid-edit-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      background: rgba(2, 8, 16, 0.98);
      border: 1px solid rgba(0, 229, 212, 0.4);
      border-left: 2px solid #00e5d4;
      border-radius: 0;
      padding: 20px;
      box-shadow: 0 0 48px rgba(0, 229, 212, 0.12), 0 0 0 1px rgba(0,229,212,0.06);
      min-width: 300px;
      display: none;
      font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace;
    }
    #asteroid-edit-popup.open { display: block; }
    #asteroid-edit-popup h3 {
      color: #00e5d4;
      margin-bottom: 16px;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(0, 229, 212, 0.35);
    }
    #asteroid-edit-popup input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      background: #000c14;
      border: 1px solid rgba(0, 229, 212, 0.2);
      border-radius: 0;
      color: #b8d8e4;
      font-size: 15px;
      font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace;
    }
    #asteroid-edit-popup input:focus {
      outline: none;
      border-color: #00e5d4;
      box-shadow: 0 0 0 1px rgba(0, 229, 212, 0.3);
    }
    #asteroid-edit-popup label {
      display: block;
      font-size: 0.7rem;
      color: #3a6070;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    #asteroid-edit-popup .form-group { margin-bottom: 12px; }
    #asteroid-edit-popup .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    #asteroid-edit-popup button {
      padding: 10px 14px;
      font-size: 14px;
      background: transparent;
      border: 1px solid rgba(0, 229, 212, 0.3);
      border-radius: 0;
      color: #b8d8e4;
      cursor: pointer;
      font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    #asteroid-edit-popup button:hover {
      background: rgba(0, 229, 212, 0.1);
      border-color: #00e5d4; color: #00e5d4;
    }
    #asteroid-edit-popup button.primary {
      background: rgba(0, 229, 212, 0.1);
      border-color: #00e5d4;
      color: #00e5d4;
    }
    #asteroid-edit-popup button.primary:hover { background: rgba(0, 229, 212, 0.2); }
    #asteroid-edit-popup button.delete {
      color: rgba(255, 50, 71, 0.75);
      border-color: rgba(255, 50, 71, 0.35);
      background: transparent;
    }
    #asteroid-edit-popup button.delete:hover {
      background: rgba(255, 50, 71, 0.1);
      border-color: #ff3247; color: #ff3247;
    }
    #asteroid-edit-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 6, 14, 0.75);
      backdrop-filter: blur(2px);
      z-index: 25;
      display: none;
    }
    #asteroid-edit-backdrop.open { display: block; }
  </style>
</head>
<body>
  <div id="app-titlebar">
    <div class="title">Taskeroid</div>
    <div class="controls">
      <button id="tb-min" class="tb-btn" type="button" aria-label="Minimize">-</button>
      <button id="tb-max" class="tb-btn" type="button" aria-label="Maximize">□</button>
      <button id="tb-close" class="tb-btn close" type="button" aria-label="Close">×</button>
    </div>
  </div>
  <div id="scene-container">
    <canvas id="wallpaper-canvas"></canvas>
  </div>
  <div id="asteroid-edit-backdrop"></div>
  <div id="asteroid-edit-popup"></div>
  <div id="task-panel">
    <div class="panel-header">
      <h2>TRACKING LOG</h2>
      <button id="panel-close" class="panel-close" type="button">×</button>
    </div>
    <div class="panel-content">
      <div id="root"></div>
    </div>
  </div>
  <script src="dist/wallpaper-renderer.js"></script>
  <script src="dist/ui.js"></script>
  <script>
    (function() {
      const panel = document.getElementById('task-panel');
      const closeBtn = document.getElementById('panel-close');
      if (closeBtn && panel) closeBtn.addEventListener('click', () => panel.classList.remove('open'));
      window.openTaskPanel = function() { panel?.classList.add('open'); };

      const minBtn = document.getElementById('tb-min');
      const maxBtn = document.getElementById('tb-max');
      const quitBtn = document.getElementById('tb-close');
      minBtn?.addEventListener('click', () => window.taskeroidWindow?.minimize?.());
      maxBtn?.addEventListener('click', async () => {
        const maximized = await window.taskeroidWindow?.toggleMaximize?.();
        if (maxBtn) maxBtn.textContent = maximized ? '❐' : '□';
      });
      quitBtn?.addEventListener('click', () => window.taskeroidWindow?.close?.());
    })();
  </script>
</body>
</html>
